<div class="site-wrap">
	<div class="banner-top">
		<h1>
			<small>I am</small>
			<a href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a>
			<small>.</small>
		</h1>
		<span class="banner-tagline">{{ .Site.Params.tagline }}</span>
	</div>
	<nav class="banner-nav">
		<a href="{{ "contact" | relURL }}">👋 Say hello</a>
		<span class="banner-nav-separator">//</span>
		<a href="{{ "archives" | relURL }}">🗄️ Archives</a>
		<span class="banner-nav-separator">//</span>
		<div class="pins-dropdown">
			<button class="pins-toggle" aria-haspopup="true">📌 Pins</button>
			<div class="pins-menu">
				{{ range hugo.Data.pins.pin }}
					{{ if or (not .draft) (not hugo.IsProduction) }}
					<a href="{{ .url | relURL }}" class="pin-item">
						<div class="pin-item-content">
							<span class="pin-title">{{ .title }}</span>
							{{ with .description }}
							<span class="pin-description">{{ . }}</span>
							{{ end }}
						</div>
					</a>
					{{ end }}
				{{ end }}
			</div>
		</div>
	</nav>
</div>
